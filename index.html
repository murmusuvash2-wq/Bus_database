<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All India Bus Search</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 20px; background-color: #f0f2f5; color: #333; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { color: #1a73e8; margin-bottom: 10px; }
        .search-box {
            width: 100%; max-width: 600px; padding: 15px; font-size: 16px;
            border: 2px solid #1a73e8; border-radius: 25px; outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .filters { max-width: 1000px; margin: 10px auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .filters select { padding: 8px 12px; border-radius: 8px; border: 1px solid #ccc; }
        .table-container { width: 100%; max-width: 1100px; margin: 20px auto; overflow-x: auto; background: white; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #1a73e8; color: white; position: sticky; top: 0; }
        tr:hover { background-color: #f8f9fa; }
        .city-badge { font-weight: bold; color: #0d47a1; }
        .time-badge { background: #e8f0fe; color: #1a73e8; padding: 4px 10px; border-radius: 15px; font-size: 13px; font-weight: bold; }
        .govt { color: #2e7d32; font-weight: 600; }
        .private { color: #c62828; font-weight: 600; }
        .stats { text-align: center; color: #666; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <h1>🚌 All India Bus Timetable</h1>
        <p>City likho aur bus dhundo (Govt + Private)</p>
        <input type="text" id="searchInput" class="search-box" placeholder="Search City (e.g. Kolkata, Ranchi, Bangalore)...">
    </div>

    <div class="filters">
        <select id="typeFilter">
            <option value="">All Types</option>
            <option value="Govt">Govt</option>
            <option value="Private">Private</option>
        </select>
        <select id="stateFilter">
            <option value="">All States</option>
        </select>
    </div>

    <div class="stats" id="stats">Loading...</div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Bus Name</th>
                    <th>Operator</th>
                    <th>From</th>
                    <th>To</th>
                    <th>Departure</th>
                    <th>Arrival</th>
                    <th>Type</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" style="text-align:center;">Loading buses...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        let allBuses = [];

        async function loadData() {
            try {
                // Prefer new export
                let res = await fetch('export/buses.json');
                if (!res.ok) {
                    // fallback to old state files
                    const states = ["AP","AR","AS","BR","CG","GA","GJ","HR","HP","JH","KA","KL","MP","MH","MN","ML","MZ","NL","OD","PB","RJ","SK","TN","TG","TR","UP","UK","WB","ALL"];
                    const results = await Promise.all(states.map(s =>
                        fetch(`${s}_busdata.json`).then(r => r.ok ? r.json() : []).catch(() => [])
                    ));
                    allBuses = results.flat();
                } else {
                    allBuses = await res.json();
                }
            } catch (e) {
                allBuses = [];
            }

            // Fill state filter
            const states = [...new Set(allBuses.map(b => b.state).filter(Boolean))].sort();
            const stateSel = document.getElementById('stateFilter');
            states.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s; opt.textContent = s;
                stateSel.appendChild(opt);
            });

            renderTable(allBuses);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            document.getElementById('stats').textContent = `${data.length} buses found`;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:red;">Koi bus nahi mili. Data update ho raha ho sakta hai.</td></tr>';
                return;
            }

            tbody.innerHTML = data.map(bus => `
                <tr>
                    <td><strong>${bus.bus_name || '-'}</strong></td>
                    <td class="${(bus.operator_type||'').toLowerCase() === 'govt' ? 'govt' : 'private'}">
                        ${bus.operator_name || bus.operator_type || '-'}
                    </td>
                    <td class="city-badge">${bus.source_city || '-'}</td>
                    <td class="city-badge">${bus.destination_city || '-'}</td>
                    <td><span class="time-badge">🕒 ${bus.departure_time || '-'}</span></td>
                    <td>${bus.arrival_time && bus.arrival_time !== 'N/A' ? bus.arrival_time : '-'}</td>
                    <td>${bus.bus_type || '-'}</td>
                </tr>
            `).join('');
        }

        function applyFilters() {
            const q = document.getElementById('searchInput').value.toLowerCase().trim();
            const type = document.getElementById('typeFilter').value;
            const state = document.getElementById('stateFilter').value;

            let filtered = allBuses.filter(bus => {
                const matchQ = !q ||
                    (bus.source_city && bus.source_city.toLowerCase().includes(q)) ||
                    (bus.destination_city && bus.destination_city.toLowerCase().includes(q)) ||
                    (bus.bus_name && bus.bus_name.toLowerCase().includes(q)) ||
                    (bus.operator_name && bus.operator_name.toLowerCase().includes(q));
                const matchType = !type || (bus.operator_type === type);
                const matchState = !state || (bus.state === state);
                return matchQ && matchType && matchState;
            });
            renderTable(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', applyFilters);
        document.getElementById('typeFilter').addEventListener('change', applyFilters);
        document.getElementById('stateFilter').addEventListener('change', applyFilters);

        loadData();
    </script>
</body>
</html>
